name: Waypoint

options:
  bundleIdPrefix: app.waypoint
  deploymentTarget:
    iOS: "17.4"
  xcodeVersion: "26.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Waypoint:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: CHANGELOG.md
        buildPhase: resources
      - path: Waypoint
        excludes:
          - Info.plist
          - Waypoint.entitlements
          - Assets.xcassets
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Waypoint/Waypoint.entitlements
        CURRENT_PROJECT_VERSION: 20
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Waypoint/Info.plist
        MARKETING_VERSION: "1.9.2"
        PRODUCT_BUNDLE_IDENTIFIER: app.pinpoint.ios
        PRODUCT_NAME: Waypoint
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CLANG_ENABLE_MODULES: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor/idevice"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS: "$(inherited) -lidevice_ffi"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor/idevice"
    dependencies:
      - target: PinpointWidget
    scheme:
      gatherCoverageData: false
  PinpointWidget:
    type: app-extension
    platform: iOS
    sources:
      - PinpointWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pinpoint.ios.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pinpoint
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        MARKETING_VERSION: "1.9.2"
        CURRENT_PROJECT_VERSION: 20
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: PinpointWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
