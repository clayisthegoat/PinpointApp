name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, 'pinpoint-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pinpoint-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Swift source size
        run: bash scripts/check-swift-source-size.sh

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0.1"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch location-enabled idevice binary
        run: bash scripts/fetch-idevice.sh

      - name: Verify location-simulation symbols
        run: |
          LC_ALL=C grep -a -q '_location_simulation_new' Vendor/idevice/libidevice_ffi.a
          LC_ALL=C grep -a -q '_location_simulation_set' Vendor/idevice/libidevice_ffi.a
          LC_ALL=C grep -a -q '_location_simulation_clear' Vendor/idevice/libidevice_ffi.a

      - name: Generate Pinpoint app icons
        run: |
          brew install librsvg
          bash scripts/render-brand-icons.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive without signing
        run: |
          xcodebuild clean archive \
            -project Waypoint.xcodeproj \
            -scheme Waypoint \
            -configuration Release \
            -archivePath build/Waypoint.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          test -d build/Waypoint.xcarchive/Products/Applications/Waypoint.app
          rm -rf Payload
          mkdir -p Payload
          ditto build/Waypoint.xcarchive/Products/Applications/Waypoint.app Payload/Waypoint.app
          ditto -c -k --sequesterRsrc --keepParent Payload Pinpoint-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pinpoint-unsigned-ipa
          path: Pinpoint-unsigned.ipa
          retention-days: 30

  release:
    name: publish release
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'clayisthegoat/PinpointApp' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/pinpoint-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: Pinpoint-unsigned-ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          test -n "$version"

          tag="v$version"
          asset="Pinpoint-unsigned.ipa"

          checksum="$(sha256sum "$asset" | awk '{ print $1 }')"
          notes="$(mktemp)"
          printf '%s\n' \
            "## Pinpoint $version" \
            "" \
            "Unsigned Pinpoint IPA. Sign it with a compatible iOS signing method before installation; SideStore is supported but optional." \
            "" \
            "### Included" \
            "" \
            "- Interactive favorite picker with pan, pinch zoom and address search" \
            "- Home screen icon rendered directly from the repository logo" \
            "- Map search with place and address suggestions" \
            "- Tap or drag the pin, then start, move, or stop the simulated location" \
            "- Guided pairing and developer-support setup" \
            "- Wi-Fi start and guided mobile-data handoff" \
            "- Reapply the selected simulated location after a five-second interval while simulation is active" \
            "- Optional disconnect notifications and background keepalive" \
            "" \
            "### Install" \
            "" \
            "1. Download $asset below." \
            "2. Sign and install it with SideStore, AltStore Classic/AltServer, or another compatible method." \
            "3. Follow the first-time setup guide: https://github.com/clayisthegoat/PinpointApp#installation" \
            "" \
            "> [!NOTE]" \
            "> Starting on mobile data uses Pinpoint's guided Airplane Mode handoff while Wi-Fi stays off." \
            "" \
            "Pinpoint uses Apple's software-simulated developer location. Apps can detect or reject simulated locations." \
            "" \
            "Source commit: $GITHUB_SHA" \
            "SHA-256: $checksum" \
            > "$notes"

          gh release create "$tag" "$asset" \
            --target "$GITHUB_SHA" \
            --title "Pinpoint v$version" \
            --notes-file "$notes" \
            --latest
